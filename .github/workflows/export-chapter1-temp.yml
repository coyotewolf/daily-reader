name: Export Chapter 1 Temp
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-chapter1-temp.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode chapter 1 English text
        run: |
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          cat=json.loads(Path('data/stories.json').read_text(encoding='utf-8'))
          book=next(b for b in cat['books'] if b['slug']=='witcher-path-notes')
          ch=next(c for c in book['chapters'] if c['episode']==1)
          raw=''.join(Path(r.removeprefix('./')).read_text(encoding='utf-8').strip() for r in ch['contentFileParts'])
          obj=json.loads(gzip.decompress(base64.b64decode(raw)).decode('utf-8'))
          lines=[]
          for p in obj['pairs']:
              en=' '.join(str(p.get('en','')).split())
              if en: lines.append(en)
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/chapter1-en.txt').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('lines', len(lines))
          PY
      - name: Commit temp export
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/chapter1-en.txt
          git commit -m 'Temporary export of chapter 1 English text'
          git push origin HEAD:main
