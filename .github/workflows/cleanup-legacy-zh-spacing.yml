name: Cleanup Legacy Chinese Prose Spacing
on:
  push:
    paths:
      - '.github/workflows/cleanup-legacy-zh-spacing.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize Chinese spacing and repackage chapters 1-6
        run: |
          python - <<'PY'
          import json,gzip,base64,pathlib,re,io
          root=pathlib.Path('.')
          sp=root/'data/stories.json'
          stories=json.loads(sp.read_text(encoding='utf-8'))
          book=next(b for b in stories['books'] if b['slug']=='witcher-path-notes')
          def clean(s):
            if not isinstance(s,str): return s
            # Remove legacy spaces introduced around formerly-English names and CJK punctuation.
            s=re.sub(r'(?<=[\u3400-\u9fff])\s+(?=[\u3400-\u9fff])','',s)
            s=re.sub(r'(?<=[\u3400-\u9fff])\s+(?=[，。！？；：「」『』、])','',s)
            s=re.sub(r'(?<=[，。！？；：「」『』、])\s+(?=[\u3400-\u9fff])','',s)
            s=re.sub(r'(?<=·)\s+(?=[\u3400-\u9fff])','',s)
            s=re.sub(r'(?<=[\u3400-\u9fff])\s+(?=·)','',s)
            s=re.sub(r' {2,}',' ',s).strip()
            return s
          for ep in range(1,7):
            ch=next(c for c in book['chapters'] if c['episode']==ep)
            src=''.join((root/p.replace('./','')).read_text(encoding='utf-8').strip() for p in ch['contentFileParts'])
            obj=json.loads(gzip.decompress(base64.b64decode(src)).decode('utf-8'))
            pairs=[]
            for p in obj['pairs']:
              q=dict(p); q['zh']=clean(q['zh']); pairs.append(q)
            content={'schemaVersion':2,'pairs':pairs,'en':[p['en'] for p in pairs],'zh':[p['zh'] for p in pairs]}
            raw=json.dumps(content,ensure_ascii=False,separators=(',',':')).encode('utf-8')
            bio=io.BytesIO()
            with gzip.GzipFile(fileobj=bio,mode='wb',mtime=0) as gz: gz.write(raw)
            b64=base64.b64encode(bio.getvalue()).decode('ascii')
            parts=[b64[i:i+6000] for i in range(0,len(b64),6000)]
            refs=[]
            for i,part in enumerate(parts,1):
              rel=f'data/chapter-{ep:02d}-retranslated-v2-{i:02d}.b64part'
              (root/rel).write_text(part,encoding='utf-8'); refs.append('./'+rel)
            joined=''.join((root/r.replace('./','')).read_text(encoding='utf-8') for r in refs)
            assert json.loads(gzip.decompress(base64.b64decode(joined)).decode('utf-8'))==content
            ch['contentFileParts']=refs
            ch['formatVersion']=2
            ch['recap']['zh']=clean(ch['recap']['zh'])
            ch['title']['zhHant']=clean(ch['title']['zhHant'])
          sp.write_text(json.dumps(stories,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate library
        run: python tools/validate_library.py
      - name: Remove this workflow and commit
        run: |
          git config user.name "coyotewolf"
          git config user.email "46484080+coyotewolf@users.noreply.github.com"
          git rm -f .github/workflows/cleanup-legacy-zh-spacing.yml
          git add data/stories.json data/chapter-*-retranslated-v2-*.b64part
          git commit -m "Polish Chinese prose spacing for chapters 1-6"
          git push