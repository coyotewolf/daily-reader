name: Fix Chapter 8 Mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-chapter8-mirror.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair chapter 8 payload schema
        run: |
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          files = [Path(f'data/chapter-08-content-{i:02d}.b64part') for i in range(1,5)]
          joined = ''.join(p.read_text(encoding='utf-8').strip() for p in files)
          content = json.loads(gzip.decompress(base64.b64decode(joined)).decode('utf-8'))
          pairs = content['pairs']
          content['en'] = [p['en'] for p in pairs]
          content['zh'] = [p['zh'] for p in pairs]
          raw = json.dumps(content, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
          b64 = base64.b64encode(gzip.compress(raw, mtime=0)).decode('ascii')
          chunks = [b64[i:i+6000] for i in range(0, len(b64), 6000)]
          assert len(chunks) == 4
          for i, chunk in enumerate(chunks, 1):
              Path(f'data/chapter-08-content-{i:02d}.b64part').write_text(chunk, encoding='utf-8')
          check = json.loads(gzip.decompress(base64.b64decode(''.join(chunks))).decode('utf-8'))
          assert check == content
          assert len(check['en']) == len(check['pairs']) == len(check['zh'])
          print('pairs', len(pairs), 'chunks', [len(c) for c in chunks])
          PY
          rm .github/workflows/fix-chapter8-mirror.yml
      - name: Commit repaired mirror payload
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/chapter-08-content-*.b64part .github/workflows/fix-chapter8-mirror.yml
          git commit -m 'Repair mirrored chapter 8 aligned payload arrays'
          git push origin HEAD:main
