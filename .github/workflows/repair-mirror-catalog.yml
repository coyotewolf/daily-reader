name: Repair Public Mirror Catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-mirror-catalog.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Restore compatible existing references
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          old_text = subprocess.check_output(['git','show','96b7e257774b09f5a8cf53f4bc132bf2cce959ff:data/stories.json'], text=True)
          old = json.loads(old_text)
          cur_path = Path('data/stories.json')
          cur = json.loads(cur_path.read_text(encoding='utf-8'))
          old_books = {b['slug']: b for b in old['books']}
          for book in cur['books']:
              old_book = old_books.get(book['slug'])
              if not old_book:
                  continue
              old_chapters = {c['episode']: c for c in old_book.get('chapters', [])}
              for ch in book.get('chapters', []):
                  if ch['episode'] <= 7 and ch['episode'] in old_chapters:
                      ch['contentFileParts'] = old_chapters[ch['episode']]['contentFileParts']
          cur_path.write_text(json.dumps(cur, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python tools/validate_library.py
          rm .github/workflows/repair-mirror-catalog.yml
      - name: Commit repaired catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stories.json .github/workflows/repair-mirror-catalog.yml
          git commit -m 'Restore compatible mirror chapter references'
          git push origin HEAD:main
