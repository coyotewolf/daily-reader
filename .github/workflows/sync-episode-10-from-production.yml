name: Sync Episode 10 From Production
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/sync-episode-10-from-production.yml"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync canonical Episode 10 revision
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request, base64, gzip
          root=pathlib.Path('.')
          base='https://path-notes-private-gateway.vercel.app/'
          with urllib.request.urlopen(base+'data/stories.json',timeout=20) as r: prod=json.load(r)
          pbook=next(b for b in prod['books'] if b['slug']=='witcher-path-notes')
          ch=next(c for c in pbook['chapters'] if c['episode']==10)
          assert ch['publishedAt']=='2026-09-07' and ch['slug']=='the-bell-beneath-the-river'
          local_path=root/'data/stories.json'; local=json.loads(local_path.read_text(encoding='utf-8'))
          lbook=next(b for b in local['books'] if b['slug']=='witcher-path-notes')
          old=next(c for c in lbook['chapters'] if c.get('episode')==10)
          parts=[]
          for rel in ch['contentFileParts']:
              fp=root/rel.replace('./','')
              with urllib.request.urlopen(base+rel.replace('./',''),timeout=20) as r: txt=r.read().decode().strip()
              fp.write_text(txt,encoding='utf-8'); parts.append(txt)
          obj=json.loads(gzip.decompress(base64.b64decode(''.join(parts))).decode())
          pairs=obj['pairs']; assert obj['en']==[p['en'] for p in pairs] and obj['zh']==[p['zh'] for p in pairs]
          assert all('。」' not in p['zh'] and '，」' not in p['zh'] for p in pairs)
          lbook['chapters'][lbook['chapters'].index(old)]=ch
          local_path.write_text(json.dumps(local,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python tools/validate_library.py
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/chapter-10-bell-beneath-river-*.b64part data/stories.json
          git commit -m "Mirror Episode 10 typography and paragraph reflow v4" || exit 0
          git push
