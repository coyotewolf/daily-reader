name: Publish Mirror Draft

on:
  push:
    branches: [main]
    paths:
      - 'drafts/chapter-*.json'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish newest draft
        run: |
          DRAFT=$(ls -1 drafts/chapter-*.json | sort | tail -1)
          python tools/publish_chapter.py "$DRAFT"
          python tools/validate_library.py
      - name: Commit mirror publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No mirror changes to commit.'
          else
            git commit -m 'Mirror daily Witcher chapter from validated draft'
            git push origin main
          fi
