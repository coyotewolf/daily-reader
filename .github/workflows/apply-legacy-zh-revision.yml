name: Apply Legacy Chinese Translation Revision
on:
  push:
    paths:
      - '.github/workflows/apply-legacy-zh-revision.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild chapters 1-6 Chinese layer
        run: |
          python - <<'PY'
          import json, gzip, base64, pathlib, re

          root=pathlib.Path('.')
          stories_path=root/'data/stories.json'
          stories=json.loads(stories_path.read_text(encoding='utf-8'))
          book=next(b for b in stories['books'] if b['slug']=='witcher-path-notes')

          # Canon names follow established Traditional Chinese Witcher usage where applicable;
          # original names are transliterated consistently so the Chinese surface contains no stray English names.
          repl=[
            ('Geralt of Rivia','利維亞的傑洛特'),('Geralt','傑洛特'),
            ('Yennefer','葉奈法'),('Dandelion','丹德里恩'),('Ciri','希里'),('Roach','蘿蔔'),
            ('Kaer Morhen','凱爾·莫罕'),('Brokilon','布洛奇隆'),('Melitele','梅里泰莉'),
            ('Elder Blood','上古之血'),('Nilfgaard','尼弗迦德'),('Redania','雷達尼亞'),('Temeria','泰莫利亞'),
            ('Oxenfurt','奧克森福特'),('Novigrad','諾維格瑞'),('Tretogor','特雷托戈'),('Maribor','馬里波'),
            ('Cintra','辛特拉'),('Pontar','龐塔爾'),
            ('Quen','昆恩法印'),('Aard','阿爾德法印'),('Igni','伊格尼法印'),
            ('Master Aven','艾文大師'),('Aven','艾文'),('Visenna','薇森娜'),
            ('Professor Linus Dorr','萊納斯·多爾教授'),('Professor Dorr','多爾教授'),('Linus Dorr','萊納斯·多爾'),
            ('Professor Ansel Marr','安瑟爾·馬爾教授'),('Ansel Marr','安瑟爾·馬爾'),
            ('Tomas Vell','托馬斯·維爾'),('Tomas','托馬斯'),('Seren','瑟倫'),
            ('Elias Merrow','伊萊亞斯·梅羅'),('Elias','伊萊亞斯'),
            ('Ravelin','拉維林'),('Holt','霍爾特'),('Marek','馬雷克'),('Lena','莉娜'),('Beren','貝倫'),('Bran','布蘭'),
            ('Edda','艾達'),('Ilse','伊爾瑟'),('Mira','米拉'),('Raven','雷文')
          ]

          # Hand-edited literary fixes for recurring legacy machine-like phrasing.
          exact={
            '傑洛特嘆氣。':'傑洛特不由得嘆了口氣。',
            '他還活著。':'他還活著，只是氣息已經相當微弱。',
            '勉強。':'',
            '廢墟。 當然。':'果然，又是一片廢墟。',
            '人類。 徽章停止震動。':'是人類。與此同時，徽章也停止了震動。',
            '他累了。':'他已經很累了。',
            '非常累。':'累得幾乎到了極限。',
            '雨已經跟了傑洛特三天。':'這場雨已經跟著傑洛特整整三天了。',
            '沒有回答。':'沒有任何回答。',
            '又開始下雨了。':'雨不知何時又落了下來。',
            '不像孩子。':'那聲音不像孩子，',
            '也不像女人。':'也不像任何女人，',
            '棕色。':'那是一雙棕色的眼睛，',
            '充滿恐懼。':'裡頭盛滿了真切的恐懼。',
            '只是一點點。':'變化極其細微。',
            '不常見。':'而且並不常見。',
            '那是一種魔法記號。':'那是一種魔法記號，',
            '本身不是法術。':'本身並非法術，',
            '而是一道指示。':'而更像一道指示——',
            '一個錨。':'一道用來固定某物的「錨」。',
          }

          def normalize_zh(s):
            if not isinstance(s,str): return s
            for a,b in repl:
              s=s.replace(a,b)
            s=s.replace('赤楊樹林','榿木林').replace('赤楊樹','榿木').replace('赤楊','榿木')
            s=s.replace('變形怪？','變形怪？').replace('水鬼','水鬼')
            # remove legacy translation spaces that make prose read like subtitles
            s=re.sub(r'(?<=[。！？」』]) +', '', s)
            s=re.sub(r' +(?=[「『])', '', s)
            s=re.sub(r'(?<=[，、；：]) +', '', s)
            s=re.sub(r' {2,}', ' ', s).strip()
            if s in exact: s=exact[s]
            return s

          def is_dialogue(en):
            e=en.lstrip()
            return e.startswith(('“','"','‘'))

          def assign_paragraphs(pairs):
            # Legacy payloads lacked canonical paragraph ids. Reflow into novel-like paragraphs
            # without changing English or Chinese semantic units.
            out=[]; p=1; narrative_run=0; prev_dialogue=False
            for i,pair in enumerate(pairs):
              en=pair.get('en','')
              dlg=is_dialogue(en)
              if i==0:
                pass
              elif dlg:
                p += 1
                narrative_run=0
              elif prev_dialogue:
                p += 1
                narrative_run=0
              else:
                narrative_run += 1
                # keep narration in fuller paragraphs rather than one-sentence subtitle blocks
                if narrative_run>=5:
                  p += 1; narrative_run=0
              q={'paragraph':p,'en':en,'zh':normalize_zh(pair.get('zh',''))}
              out.append(q)
              prev_dialogue=dlg
            # remove empty editorial fragments by folding their English into the next pair while preserving text
            cleaned=[]
            for q in out:
              if q['zh']!='':
                cleaned.append(q)
              elif cleaned:
                cleaned[-1]['en'] += ' ' + q['en']
            return cleaned

          for ep in range(1,7):
            ch=next(c for c in book['chapters'] if c['episode']==ep)
            if 'contentFileParts' in ch:
              payload=''.join((root/p.replace('./','')).read_text(encoding='utf-8').strip() for p in ch['contentFileParts'])
            else:
              payload=(root/ch['contentFile'].replace('./','')).read_text(encoding='utf-8').strip()
            obj=json.loads(gzip.decompress(base64.b64decode(payload)).decode('utf-8'))
            if obj.get('pairs'):
              src_pairs=obj['pairs']
            else:
              src_pairs=[{'en':e,'zh':z} for e,z in zip(obj.get('en',[]),obj.get('zh',[]))]
            pairs=assign_paragraphs(src_pairs)
            assert pairs and all(p['en'].strip() and p['zh'].strip() for p in pairs)
            content={'schemaVersion':2,'pairs':pairs,'en':[p['en'] for p in pairs],'zh':[p['zh'] for p in pairs]}
            raw=json.dumps(content,ensure_ascii=False,separators=(',',':')).encode('utf-8')
            import io
            bio=io.BytesIO()
            with gzip.GzipFile(fileobj=bio,mode='wb',mtime=0) as gz: gz.write(raw)
            b64=base64.b64encode(bio.getvalue()).decode('ascii')
            parts=[b64[i:i+6000] for i in range(0,len(b64),6000)]
            paths=[]
            for idx,part in enumerate(parts,1):
              rel=f'data/chapter-{ep:02d}-retranslated-{idx:02d}.b64part'
              (root/rel).write_text(part,encoding='utf-8')
              paths.append('./'+rel)
            # exact round trip verification
            joined=''.join((root/p.replace('./','')).read_text(encoding='utf-8') for p in paths)
            check=json.loads(gzip.decompress(base64.b64decode(joined)).decode('utf-8'))
            assert check==content
            ch['contentFileParts']=paths
            ch.pop('contentFile',None)
            ch['formatVersion']=2
            ch['title']['zhHant']=normalize_zh(ch['title'].get('zhHant',''))
            ch['recap']['zh']=normalize_zh(ch['recap'].get('zh',''))
            if isinstance(ch.get('glossary'),dict):
              ch['glossary']={k:normalize_zh(v) for k,v in ch['glossary'].items()}

          # Metadata write happens after all content parts have been built and round-trip checked.
          stories_path.write_text(json.dumps(stories,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate library
        run: python tools/validate_library.py
      - name: Remove temporary workflows and commit
        run: |
          git config user.name "coyotewolf"
          git config user.email "46484080+coyotewolf@users.noreply.github.com"
          git rm -f .github/workflows/temporary-dump-legacy.yml .github/workflows/apply-legacy-zh-revision.yml
          git add data/stories.json data/chapter-*-retranslated-*.b64part
          git commit -m "Revise Chinese translations for chapters 1-6"
          git push