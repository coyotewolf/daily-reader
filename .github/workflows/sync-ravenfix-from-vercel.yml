name: Sync Raven Translation From Canonical Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-ravenfix-from-vercel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mirror canonical story catalog and payloads
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path

          base = 'https://path-notes-private-gateway.vercel.app/'
          expected = 'fbc68d9de98d62a8fcf522d9396ab1c2de6a0eea'

          with urllib.request.urlopen(base + 'api/version', timeout=20) as r:
              version = json.load(r)
          assert version.get('commit') == expected, (version, expected)

          def fetch_text(rel):
              with urllib.request.urlopen(base + rel, timeout=30) as r:
                  return r.read().decode('utf-8')

          catalog_text = fetch_text('data/stories.json')
          catalog = json.loads(catalog_text)
          book = next(b for b in catalog['books'] if b['slug'] == 'witcher-path-notes')
          refs = []
          for chapter in book['chapters']:
              refs.extend(chapter.get('contentFileParts') or [])

          for ref in sorted(set(refs)):
              rel = ref.removeprefix('./')
              p = Path(rel)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(fetch_text(rel), encoding='utf-8')

          Path('data/stories.json').write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Mirrored chapters:', [c['episode'] for c in book['chapters']])
          print('Mirrored payload parts:', len(set(refs)))
          PY

      - name: Validate mirror
        run: python tools/validate_library.py

      - name: Commit mirror
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stories.json data/*.b64part
          if git diff --cached --quiet; then
            echo 'Mirror already current.'
            exit 0
          fi
          git commit -m 'Mirror corrected Raven translation from private canonical'
          git push origin HEAD:main
